<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acheter des USDT — Étape 3 · Preuve</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-5 bg-slate-900 text-white">

  <div class="w-full max-w-md entree-ecran">
    <div class="flex items-center justify-between mb-4">
      <a href="/achat-step2.html" class="text-sm text-slate-400 hover:text-slate-200">&larr; Retour</a>
      <span class="text-xs text-slate-500">Étape 3 sur 5</span>
    </div>
    <div class="etapes mb-6" id="barre-etapes"></div>

    <div class="card glow-achat p-7 relative">
      <div id="error-container" class="hidden absolute inset-0 bg-slate-900/95 z-10 flex flex-col items-center justify-center text-center p-6 rounded-2xl">
        <div class="text-red-500 text-4xl mb-4">⚠️</div>
        <h2 class="text-xl font-bold mb-2">Session Expirée</h2>
        <button onclick="window.location.href='/achat-step1.html'" class="bg-emerald-600 text-white px-6 py-2 rounded-lg">Recommencer</button>
      </div>

      <div id="form-container">
        <h1 class="font-display text-2xl font-semibold mb-1">Preuve de paiement</h1>
        <p class="text-sm text-slate-400 mb-6">Ajoutez la capture d'écran Mobile Money.</p>

        <label for="fichier-preuve" id="zone-depot" class="block border-2 border-dashed border-slate-600 hover:border-emerald-500 rounded-2xl p-8 text-center cursor-pointer transition bg-slate-800/50">
          <div class="text-3xl mb-2">📎</div>
          <p class="text-sm text-slate-300 font-medium" id="texte-depot">Cliquez pour choisir une image</p>
          <input type="file" id="fichier-preuve" accept="image/*" class="hidden" />
        </label>

        <p id="erreur-msg" class="text-sm text-rose-400 hidden mt-4 text-center"></p>
        
        <button id="btn-envoyer" class="btn btn-primary w-full mt-6 bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold shadow-lg transition disabled:opacity-50">
          Envoyer la preuve
        </button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = 'https://qlsetlqyejwrhztbesto.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc2V0bHF5ZWp3cmh6dGJlc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTc1NzIsImV4cCI6MjEwNDQzMzU3Mn0.kcaf8RzfhPDGsAFhRfqDf6g7JiMSxh2Aoc2kk9v6gZ4';
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    document.addEventListener('DOMContentLoaded', () => {
        const dataJSON = sessionStorage.getItem('transaction_achat');
        if (!dataJSON) {
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
            return;
        }

        const transaction = JSON.parse(dataJSON);
        const input = document.getElementById('fichier-preuve');
        const btn = document.getElementById('btn-envoyer');
        const errorMsg = document.getElementById('erreur-msg');

        input.addEventListener('change', () => {
            if (input.files[0]) {
                document.getElementById('texte-depot').textContent = "Fichier : " + input.files[0].name;
                document.getElementById('zone-depot').classList.add('border-emerald-500');
            }
        });

        btn.addEventListener('click', async () => {
            if (!input.files[0]) {
                errorMsg.textContent = "Veuillez sélectionner une image.";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = "Envoi en cours...";

            try {
                // 1. Upload du fichier vers Supabase Storage
                const file = input.files[0];
                const fileName = `${transaction.id}-${Date.now()}.jpg`;
                
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('preuves') // Nom du bucket
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                // 2. Récupérer l'URL publique
                const { data: urlData } = supabase.storage.from('preuves').getPublicUrl(fileName);
                const publicUrl = urlData.publicUrl;

                // 3. Mettre à jour la transaction dans la base de données
                const { error: updateError } = await supabase
                    .from('transactions')
                    .update({ preuve_url: publicUrl })
                    .eq('id', transaction.id);

                if (updateError) throw updateError;

                window.location.href = '/achat-step4.html';

            } catch (e) {
                console.error(e);
                errorMsg.textContent = "Erreur : " + e.message;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Envoyer la preuve";
            }
        });
    });
  </script>
</body>
</html>
