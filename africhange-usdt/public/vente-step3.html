<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Vendre des USDT — Étape 3 · Preuve</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Style pour forcer le clic sur mobile */
  .upload-zone {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .upload-zone:active {
    transform: scale(0.98);
    background-color: rgba(245, 158, 11, 0.1);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 bg-slate-900 text-white">

  <div class="w-full max-w-md entree-ecran">
    <div class="flex items-center justify-between mb-4">
      <a href="/vente-step2.html" class="text-sm text-slate-400 hover:text-slate-200">&larr; Retour</a>
      <span class="text-xs text-slate-500">Étape 3 sur 5</span>
    </div>
    <div class="etapes mb-6" id="barre-etapes"></div>

    <div class="card glow-vente p-7 relative">
      
      <!-- Erreur Session -->
      <div id="error-container" class="hidden absolute inset-0 bg-slate-900/95 z-10 flex flex-col items-center justify-center text-center p-6 rounded-2xl">
        <div class="text-red-500 text-4xl mb-4">⚠️</div>
        <h2 class="text-xl font-bold mb-2">Session Expirée</h2>
        <button onclick="window.location.href='/vente-step1.html'" class="bg-amber-600 text-white px-6 py-2 rounded-lg">Recommencer</button>
      </div>

      <div id="form-container">
        <h1 class="font-display text-2xl font-semibold mb-1">Preuve de transaction</h1>
        <p class="text-sm text-slate-400 mb-6">Indiquez le hash (TxID) et ajoutez une capture.</p>

        <!-- Champ Hash TxID -->
        <label class="text-xs text-slate-400 mb-1 block font-medium">Hash de transaction (TxID)</label>
        <input type="text" id="txid" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none transition mb-4" placeholder="Ex : 0x8f3c...a91d" />

        <!-- Zone de dépôt corrigée pour mobile -->
        <div id="zone-depot" class="upload-zone block border-2 border-dashed border-slate-600 rounded-2xl p-6 text-center bg-slate-800/50 mb-4">
          <div class="text-2xl mb-2">📎</div>
          <p class="text-sm text-slate-300 font-medium" id="texte-depot">Cliquez ici pour ajouter une capture (optionnel)</p>
        </div>
        
        <!-- Input caché -->
        <input type="file" id="fichier-preuve" accept="image/*" class="hidden" />

        <p id="erreur-msg" class="text-sm text-rose-400 hidden mb-3 text-center"></p>
        
        <button id="btn-envoyer" class="btn w-full bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl font-bold shadow-lg transition disabled:opacity-50">
          Envoyer la preuve
        </button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = 'https://qlsetlqyejwrhztbesto.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc2V0bHF5ZWp3cmh6dGJlc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTc1NzIsImV4cCI6MjEwNDQzMzU3Mn0.kcaf8RzfhPDGsAFhRfqDf6g7JiMSxh2Aoc2kk9v6gZ4';
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    document.addEventListener('DOMContentLoaded', () => {
        const dataJSON = sessionStorage.getItem('transaction_vente');
        if (!dataJSON) {
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
            return;
        }

        const transaction = JSON.parse(dataJSON);
        const input = document.getElementById('fichier-preuve');
        const zone = document.getElementById('zone-depot');
        const texte = document.getElementById('texte-depot');
        const btn = document.getElementById('btn-envoyer');
        const errorMsg = document.getElementById('erreur-msg');
        const txidInput = document.getElementById('txid');

        // --- CORRECTION MOBILE : Forcer le clic via JS ---
        zone.addEventListener('click', (e) => {
            e.preventDefault();
            input.click();
        });

        // Quand un fichier est choisi
        input.addEventListener('change', () => {
            if (input.files && input.files[0]) {
                const fileName = input.files[0].name;
                texte.textContent = "✅ " + fileName;
                texte.classList.add('text-amber-400');
                zone.classList.add('border-amber-500', 'bg-amber-500/10');
                zone.classList.remove('border-slate-600');
                errorMsg.classList.add('hidden');
            }
        });

        // Envoi
        btn.addEventListener('click', async () => {
            const txid = txidInput.value.trim();
            
            // Vérification du TxID (Obligatoire pour la vente)
            if (!txid) {
                errorMsg.textContent = "Le Hash (TxID) est obligatoire.";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = "Envoi en cours...";

            try {
                let publicUrl = null;

                // 1. Upload du fichier SI présent (Optionnel pour la vente)
                if (input.files && input.files[0]) {
                    const file = input.files[0];
                    const fileName = `${transaction.id}-${Date.now()}.jpg`;
                    
                    const { data: uploadData, error: uploadError } = await supabase.storage
                        .from('preuves')
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = supabase.storage.from('preuves').getPublicUrl(fileName);
                    publicUrl = urlData.publicUrl;
                }

                // 2. Mettre à jour la transaction (TxID + URL image si existe)
                const updateData = { hash_transaction: txid };
                if (publicUrl) updateData.preuve_url = publicUrl;

                const { error: updateError } = await supabase
                    .from('transactions')
                    .update(updateData)
                    .eq('id', transaction.id);

                if (updateError) throw updateError;

                window.location.href = '/vente-step4.html';

            } catch (e) {
                console.error(e);
                errorMsg.textContent = "Erreur : " + e.message;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Envoyer la preuve";
            }
        });
    });
  </script>
</body>
</html>
