<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AfriChange USDT — Admin Pro</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Icons (Phosphor Icons) -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Outfit', sans-serif; }
  .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  .glass-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  
  /* Style pour les notifications Toast */
  #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: rgba(15, 23, 42, 0.95); color: white; padding: 1rem 1.5rem; border-radius: 0.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 0.75rem; min-width: 300px; animation: slideIn 0.3s ease-out forwards; border-left: 4px solid #10b981; }
  .toast.warning { border-left-color: #f59e0b; }
  .toast.error { border-left-color: #ef4444; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeOut { to { transform: translateX(100%); opacity: 0; } }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen selection:bg-emerald-500 selection:text-white">

  <!-- Conteneur pour les notifications -->
  <div id="toast-container"></div>

  <!-- Header -->
  <nav class="fixed top-0 w-full z-50 glass-panel border-b-0 border-white/10 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg text-slate-900 font-bold text-xl">₮</div>
      <div>
        <h1 class="font-bold text-lg tracking-tight text-white">AfriChange <span class="text-emerald-400">Admin</span></h1>
        <p class="text-xs text-slate-400">Gestion Centrale</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="afficherNotifications()" class="relative p-2 rounded-full hover:bg-white/5 transition group">
        <i class="ph ph-bell text-xl text-slate-300 group-hover:text-emerald-400 transition"></i>
        <span id="badge-notif" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-slate-900 animate-pulse"></span>
      </button>
      <button onclick="deconnexionAdmin()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-800 hover:bg-red-500/10 hover:text-red-400 border border-slate-700 transition text-sm font-medium">
        <i class="ph ph-sign-out"></i> Déconnexion
      </button>
    </div>
  </nav>

  <main class="pt-24 pb-10 px-6 max-w-7xl mx-auto space-y-8">

    <!-- STATS -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 animate-fade-in">
      <div class="glass-card p-6 rounded-2xl relative overflow-hidden group">
        <div class="flex justify-between items-start mb-4">
          <div><p class="text-slate-400 text-sm font-medium">Bénéfice Total</p><h3 id="stat-benef" class="text-3xl font-bold text-white mt-1">— FCFA</h3></div>
          <div class="p-3 bg-emerald-500/10 rounded-xl text-emerald-400"><i class="ph ph-currency-dollar text-2xl"></i></div>
        </div>
      </div>
      <div class="glass-card p-6 rounded-2xl relative overflow-hidden group">
        <div class="flex justify-between items-start mb-4">
          <div><p class="text-slate-400 text-sm font-medium">Transactions Validées</p><h3 id="stat-validees" class="text-3xl font-bold text-white mt-1">—</h3></div>
          <div class="p-3 bg-blue-500/10 rounded-xl text-blue-400"><i class="ph ph-check-circle text-2xl"></i></div>
        </div>
      </div>
      <div class="glass-card p-6 rounded-2xl relative overflow-hidden group">
        <div class="flex justify-between items-start mb-4">
          <div><p class="text-slate-400 text-sm font-medium">Volume Acheté</p><h3 id="stat-achat" class="text-3xl font-bold text-white mt-1">— USDT</h3></div>
          <div class="p-3 bg-cyan-500/10 rounded-xl text-cyan-400"><i class="ph ph-arrow-down-left text-2xl"></i></div>
        </div>
      </div>
      <div class="glass-card p-6 rounded-2xl relative overflow-hidden group">
        <div class="flex justify-between items-start mb-4">
          <div><p class="text-slate-400 text-sm font-medium">Volume Vendu</p><h3 id="stat-vente" class="text-3xl font-bold text-white mt-1">— USDT</h3></div>
          <div class="p-3 bg-amber-500/10 rounded-xl text-amber-400"><i class="ph ph-arrow-up-right text-2xl"></i></div>
        </div>
      </div>
    </section>

    <!-- CONTENU PRINCIPAL -->
    <div class="flex flex-col lg:flex-row gap-8">
      
      <!-- COLONNE GAUCHE: TRANSACTIONS -->
      <div class="lg:w-2/3 space-y-6 animate-fade-in" style="animation-delay: 0.1s;">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold text-white flex items-center gap-2"><i class="ph ph-list-dashes text-emerald-400"></i> Transactions Récentes</h2>
          <div class="flex gap-2">
            <select id="filtre-statut" class="bg-slate-900 border border-slate-700 text-slate-300 text-sm rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="">Tous les statuts</option>
              <option value="en_attente">En attente</option>
              <option value="valide">Validées 🟢</option>
              <option value="rejete">Rejetées ⚫</option>
            </select>
            <button onclick="rafraichirTransactions()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg border border-slate-700 transition"><i class="ph ph-arrows-clockwise"></i></button>
          </div>
        </div>

        <div class="glass-panel rounded-2xl overflow-hidden shadow-xl">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                  <th class="p-4 font-semibold">Client</th>
                  <th class="p-4 font-semibold">Type</th>
                  <th class="p-4 font-semibold">Montant</th>
                  <th class="p-4 font-semibold">Statut</th>
                  <th class="p-4 font-semibold text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="corps-tableau" class="divide-y divide-slate-800 text-sm">
                <tr><td colspan="5" class="p-8 text-center text-slate-500">Chargement des données...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- COLONNE DROITE: CONFIG & AGENTS -->
      <div class="lg:w-1/3 space-y-6 animate-fade-in" style="animation-delay: 0.2s;">
        
        <!-- Config -->
        <div class="glass-card p-6 rounded-2xl">
          <h3 class="font-bold text-white mb-4 flex items-center gap-2"><i class="ph ph-sliders text-emerald-400"></i> Configuration</h3>
          <form id="form-config" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs text-slate-400 block mb-1">Taux Achat</label>
                <input type="number" id="cfg-taux-achat" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-emerald-500 outline-none" placeholder="750">
              </div>
              <div>
                <label class="text-xs text-slate-400 block mb-1">Taux Vente</label>
                <input type="number" id="cfg-taux-vente" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-emerald-500 outline-none" placeholder="730">
              </div>
            </div>
            <div>
              <label class="text-xs text-slate-400 block mb-1">Adresse USDT</label>
              <input type="text" id="cfg-adresse" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono text-slate-300 focus:border-emerald-500 outline-none" placeholder="0x...">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg shadow-lg transition">Sauvegarder</button>
          </form>
        </div>

        <!-- Agents -->
        <div class="glass-card p-6 rounded-2xl flex flex-col h-[500px]">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-white flex items-center gap-2"><i class="ph ph-users text-amber-400"></i> Agents Mobile Money</h3>
            <button onclick="ouvrirModalAgent()" class="text-xs bg-slate-800 hover:bg-emerald-600 hover:text-white text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1">
              <i class="ph ph-plus"></i> Ajouter
            </button>
          </div>
          <div id="liste-agents-admin" class="flex-1 overflow-y-auto space-y-3 pr-2">
            <div class="text-center text-slate-500 mt-10">Chargement...</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- MODALS (Preuve & Agent) -->
  <div id="modale-preuve" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm z-[60] flex items-center justify-center p-4" onclick="fermerModale()">
    <div class="relative max-w-3xl w-full"><button class="absolute top-4 right-4 text-white hover:text-red-400 text-3xl">&times;</button><img id="modale-image" src="" alt="Preuve" class="w-full h-auto rounded-xl shadow-2xl border border-white/10" /></div>
  </div>

  <div id="modale-agent" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4">Nouvel Agent</h3>
      <form id="form-nouvel-agent" class="space-y-4">
        <div><label class="text-xs text-slate-400 block mb-1">Pays</label><select id="new-agent-pays" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none"><option value="Burkina Faso">🇧🇫 Burkina Faso</option><option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option><option value="Bénin">🇯 Bénin</option><option value="Togo">🇹🇬 Togo</option></select></div>
        <div><label class="text-xs text-slate-400 block mb-1">Opérateur</label><select id="new-agent-operateur" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none"><option value="Orange Money">Orange Money</option><option value="Moov Money">Moov Money</option><option value="MTN Money">MTN Money</option><option value="Wave">Wave</option></select></div>
        <div><label class="text-xs text-slate-400 block mb-1">Numéro</label><input type="text" id="new-agent-numero" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none" placeholder="+225 07..." required></div>
        <div class="flex gap-3 pt-2"><button type="button" onclick="fermerModalAgent()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-2 rounded-lg transition">Annuler</button><button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg font-medium shadow-lg transition">Créer</button></div>
      </form>
    </div>
  </div>

  <!-- SCRIPT LOGIQUE CORRIGÉ -->
  <script src="/js/admin.js"></script>
  <script>
    // --- CONFIG SUPABASE ---
    const SB_URL = 'https://qlsetlqyejwrhztbesto.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc2V0bHF5ZWp3cmh6dGJlc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTc1NzIsImV4cCI6MjEwNDQzMzU3Mn0.kcaf8RzfhPDGsAFhRfqDf6g7JiMSxh2Aoc2kk9v6gZ4';
    let supabaseDirect;
    if (typeof supabase !== 'undefined') {
      supabaseDirect = supabase.createClient(SB_URL, SB_KEY);
    }

    // --- SYSTÈME DE NOTIFICATION (TOAST) ---
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'warning' ? 'warning' : type === 'error' ? 'error' : ''}`;
      let icon = '';
      if (type === 'success') icon = '✅';
      if (type === 'error') icon = '❌';
      if (type === 'warning') icon = '⚠️';
      toast.innerHTML = `<span class="text-xl">${icon}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease-out forwards';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // --- AUTH ---
    async function verifierAuth() {
      if (typeof verifierAuthAdmin === 'function') await verifierAuthAdmin();
      else if (!sessionStorage.getItem('africhange_admin_session')) window.location.href = '/admin-login.html';
    }
    verifierAuth();

    // --- STATS ---
    async function rafraichirStats() {
      if (!supabaseDirect) return;
      try {
        const { data, error } = await supabaseDirect.from('transactions').select('type_transaction, montant_usdt, benefice_estime').eq('statut', 'valide');
        if (error) throw error;
        const nb = data.length;
        const benef = data.reduce((sum, t) => sum + (parseFloat(t.benefice_estime) || 0), 0);
        const achat = data.filter(t => t.type_transaction === 'achat').reduce((sum, t) => sum + (parseFloat(t.montant_usdt) || 0), 0);
        const vente = data.filter(t => t.type_transaction === 'vente').reduce((sum, t) => sum + (parseFloat(t.montant_usdt) || 0), 0);
        
        document.getElementById('stat-benef').textContent = benef.toLocaleString('fr-FR') + ' FCFA';
        document.getElementById('stat-validees').textContent = nb;
        document.getElementById('stat-achat').textContent = achat.toFixed(2) + ' USDT';
        document.getElementById('stat-vente').textContent = vente.toFixed(2) + ' USDT';
      } catch (e) { console.error(e); }
    }

    // --- TRANSACTIONS (CORRIGÉ POUR AFFICHER LES DONNÉES) ---
    async function rafraichirTransactions() {
      const corps = document.getElementById('corps-tableau');
      corps.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-500">Actualisation...</td></tr>';
      
      try {
        const statut = document.getElementById('filtre-statut').value;
        let query = supabaseDirect.from('transactions').select('*').order('created_at', { ascending: false }).limit(50);
        if (statut) query = query.eq('statut', statut);
        
        const { data, error } = await query;
        if (error) throw error;

        if (!data || data.length === 0) {
          corps.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">Aucune transaction trouvée.</td></tr>';
          return;
        }

        verifierNouvellesTransactions(data);

        corps.innerHTML = data.map(t => {
          const nomClient = `${t.nom || ''} ${t.prenom || ''}`.trim() || 'Anonyme';
          const telephone = t.numero_telephone || '-';
          const typeTx = t.type_transaction || 'inconnu';
          const montantUSDT = t.montant_usdt || 0;
          const montantFCFA = t.montant_fcfa || 0;
          const statutTx = t.statut || 'en_attente';
          
          const isAchat = typeTx === 'achat';
          const typeBadge = isAchat 
            ? '<span class="px-2 py-1 rounded bg-cyan-500/10 text-cyan-400 text-xs font-bold border border-cyan-500/20">ACHAT</span>' 
            : '<span class="px-2 py-1 rounded bg-amber-500/10 text-amber-400 text-xs font-bold border border-amber-500/20">VENTE</span>';
          
          let statusClass = 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';
          let statusLabel = 'En attente';
          if (statutTx === 'valide' || statutTx === 'validée') { statusClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'; statusLabel = 'Validée'; }
          else if (statutTx === 'rejete' || statutTx === 'rejetée') { statusClass = 'bg-red-500/10 text-red-400 border-red-500/20'; statusLabel = 'Rejetée'; }

          let actionsHtml = '<span class="text-xs text-slate-600 italic">Terminé</span>';
          if (statutTx === 'en_attente') {
              actionsHtml = `<div class="flex justify-end gap-2">
                    <button onclick="validerTransaction('${t.id}')" class="p-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition" title="Valider"><i class="ph ph-check"></i></button>
                    <button onclick="rejeterTransaction('${t.id}')" class="p-2 rounded-lg bg-slate-700 hover:bg-red-500 text-white transition" title="Rejeter"><i class="ph ph-x"></i></button>
                    ${t.preuve_url ? `<button onclick="ouvrirModale('${t.preuve_url}')" class="p-2 rounded-lg bg-slate-700 hover:bg-blue-500 text-white transition" title="Voir Preuve"><i class="ph ph-eye"></i></button>` : ''}
                  </div>`;
          }

          return `
            <tr class="hover:bg-white/5 transition group">
              <td class="p-4"><div class="font-bold text-white">${nomClient}</div><div class="text-xs text-slate-400">${telephone}</div></td>
              <td class="p-4">${typeBadge}</td>
              <td class="p-4"><div class="font-bold text-slate-200">${montantUSDT} USDT</div><div class="text-xs text-slate-500">${formaterFCFA(montantFCFA)}</div></td>
              <td class="p-4"><span class="status-badge ${statusClass} border">${statusLabel}</span></td>
              <td class="p-4 text-right">${actionsHtml}</td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
        corps.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400">Erreur: ${e.message}. Vérifiez la console (F12).</td></tr>`;
      }
    }

    function formaterFCFA(montant) {
        if (!montant && montant !== 0) return '0 FCFA';
        return parseFloat(montant).toLocaleString('fr-FR') + ' FCFA';
    }

    // --- NOTIFICATIONS ---
    let dernierNbAttente = 0;
    function verifierNouvellesTransactions(data) {
      const nb = data.filter(t => t.statut === 'en_attente').length;
      if (nb > 0 && nb > dernierNbAttente) {
        showToast(`🔔 ${nb} nouvelle(s) transaction(s) en attente !`, 'warning');
      }
      dernierNbAttente = nb;
      const badge = document.getElementById('badge-notif');
      if (nb > 0) { badge.textContent = nb; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }
    }
    function afficherNotifications() { showToast(`Vous avez ${dernierNbAttente} transaction(s) en attente.`, 'info'); document.getElementById('filtre-statut').value = 'en_attente'; rafraichirTransactions(); }

    // --- ACTIONS ---
    async function validerTransaction(id) { if(!confirm("Valider cette transaction ?")) return; await changerStatutTransaction(id, 'valide'); showToast("Transaction validée !", "success"); rafraichirTransactions(); rafraichirStats(); }
    async function rejeterTransaction(id) { const m = prompt("Motif du rejet :"); if(m===null) return; await changerStatutTransaction(id, 'rejete', m); showToast("Transaction rejetée.", "error"); rafraichirTransactions(); }
    function ouvrirModale(url) { document.getElementById('modale-image').src = url; document.getElementById('modale-preuve').classList.remove('hidden'); }
    function fermerModale() { document.getElementById('modale-preuve').classList.add('hidden'); }

    // --- AGENTS ---
    async function chargerAgentsUI() {
      try {
        const { data, error } = await supabaseDirect.from('agents').select('*').order('pays');
        if (error) throw error;
        const container = document.getElementById('liste-agents-admin');
        if (!data || data.length === 0) { container.innerHTML = '<div class="text-center text-slate-500 text-sm py-4">Aucun agent configuré.</div>'; return; }
        container.innerHTML = data.map(a => `
          <div class="bg-slate-950/50 border border-slate-800 p-3 rounded-xl flex flex-col gap-2 hover:border-emerald-500/30 transition group">
            <div class="flex justify-between items-start">
              <div><div class="text-xs font-bold text-emerald-400 uppercase tracking-wide">${a.pays}</div><div class="text-xs text-slate-400 font-medium">${a.operateur}</div></div>
              <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition"><button onclick="supprimerAgent('${a.id}')" class="text-slate-500 hover:text-red-400 p-1"><i class="ph ph-trash"></i></button></div>
            </div>
            <div class="flex gap-2 items-center"><input type="text" value="${a.numero || ''}" class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:border-emerald-500 outline-none" id="input-agent-${a.id}"><button onclick="sauverAgent('${a.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded font-medium transition">OK</button></div>
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }
    async function sauverAgent(id) { const input = document.getElementById(`input-agent-${id}`); const btn = input.nextElementSibling; const oldText = btn.textContent; btn.textContent = '...'; try { await enregistrerAgent(id, { numero: input.value }); btn.textContent = '✓'; showToast("Numéro mis à jour", "success"); setTimeout(() => btn.textContent = oldText, 1500); } catch (e) { alert("Erreur: " + e.message); btn.textContent = oldText; } }
    async function supprimerAgent(id) { if(!confirm("Supprimer cet agent ?")) return; try { await supprimerAgent(id); chargerAgentsUI(); showToast("Agent supprimé", "error"); } catch(e) { alert("Erreur suppression"); } }
    function ouvrirModalAgent() { document.getElementById('modale-agent').classList.remove('hidden'); }
    function fermerModalAgent() { document.getElementById('modale-agent').classList.add('hidden'); }
    document.getElementById('form-nouvel-agent').addEventListener('submit', async (e) => { e.preventDefault(); const pays = document.getElementById('new-agent-pays').value; const op = document.getElementById('new-agent-operateur').value; const num = document.getElementById('new-agent-numero').value; try { await ajouterAgent({ pays, operateur: op, numero: num }); fermerModalAgent(); chargerAgentsUI(); showToast("Agent ajouté !", "success"); } catch(err) { alert("Erreur: " + err.message); } });

    // --- CONFIG FORM ---
    document.getElementById('form-config').addEventListener('submit', async (e) => { e.preventDefault(); const btn = e.target.querySelector('button'); btn.textContent = 'Enregistrement...'; try { await enregistrerConfig({ taux_achat_client: parseFloat(document.getElementById('cfg-taux-achat').value), taux_vente_client: parseFloat(document.getElementById('cfg-taux-vente').value), adresse_usdt_reception: document.getElementById('cfg-adresse').value }); showToast("Configuration sauvegardée !", "success"); } catch(err) { showToast("Erreur sauvegarde", "error"); alert("Erreur: " + err.message); } btn.textContent = 'Sauvegarder'; });

    // --- INIT ---
    rafraichirStats();
    rafraichirTransactions();
    chargerAgentsUI();
    setInterval(() => { rafraichirTransactions(); rafraichirStats(); }, 30000);
  </script>
</body>
</html>
