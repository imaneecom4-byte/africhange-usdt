<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfriChange Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: #0f172a; color: white; font-family: sans-serif; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .btn { padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; }
  .btn-green { background: #10b981; color: white; }
  .btn-red { background: #ef4444; color: white; }
  .btn-blue { background: #3b82f6; color: white; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
  .badge { padding: 4px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
  .badge-yellow { background: rgba(234, 179, 8, 0.2); color: #eab308; }
  .badge-green { background: rgba(16, 185, 129, 0.2); color: #10b981; }
  .badge-red { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
  #toast { position: fixed; top: 20px; right: 20px; background: #1e293b; padding: 15px; border-radius: 8px; border-left: 4px solid #10b981; display: none; z-index: 1000; }
  /* Modal Image */
  #modal-img { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
  #modal-img img { max-width: 90%; max-height: 90%; border-radius: 8px; }
</style>
</head>
<body class="p-6">

  <div id="toast">Action réussie !</div>
  
  <!-- Modal Image -->
  <div id="modal-img" onclick="this.style.display='none'">
    <img id="img-preview" src="">
  </div>

  <div class="flex justify-between items-center mb-8">
    <h1 class="text-2xl font-bold text-emerald-400">AfriChange Admin</h1>
    <button onclick="location.reload()" class="btn btn-blue">Rafraîchir</button>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
    <div class="card"><h3 class="text-slate-400 text-sm">En Attente</h3><p id="stat-attente" class="text-2xl font-bold text-yellow-400">0</p></div>
    <div class="card"><h3 class="text-slate-400 text-sm">Validées</h3><p id="stat-valide" class="text-2xl font-bold text-emerald-400">0</p></div>
    <div class="card"><h3 class="text-slate-400 text-sm">Total USDT</h3><p id="stat-volume" class="text-2xl font-bold text-white">0</p></div>
  </div>

  <!-- Transactions -->
  <div class="card overflow-x-auto">
    <h2 class="text-xl font-bold mb-4">Transactions Récentes</h2>
    <table>
      <thead>
        <tr>
          <th>Client</th>
          <th>Type</th>
          <th>Montant</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="5" class="text-center text-slate-500 py-8">Chargement...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const SB_URL = 'https://qlsetlqyejwrhztbesto.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc2V0bHF5ZWp3cmh6dGJlc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTc1NzIsImV4cCI6MjEwNDQzMzU3Mn0.kcaf8RzfhPDGsAFhRfqDf6g7JiMSxh2Aoc2kk9v6gZ4';
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    async function loadDashboard() {
      const { data, error } = await supabase.from('transactions').select('*').order('created_at', { ascending: false });
      
      if (error) {
        document.getElementById('table-body').innerHTML = `<tr><td colspan="5" class="text-red-400 text-center">${error.message}</td></tr>`;
        return;
      }

      // Stats
      const attente = data.filter(t => t.statut === 'en_attente').length;
      const valide = data.filter(t => t.statut === 'valide').length;
      const volume = data.reduce((sum, t) => sum + (parseFloat(t.montant_usdt) || 0), 0).toFixed(2);
      
      document.getElementById('stat-attente').textContent = attente;
      document.getElementById('stat-valide').textContent = valide;
      document.getElementById('stat-volume').textContent = volume + ' USDT';

      // Table
      const tbody = document.getElementById('table-body');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-slate-500 py-8">Aucune transaction</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(t => {
        let badgeClass = 'badge-yellow';
        if (t.statut === 'valide') badgeClass = 'badge-green';
        if (t.statut === 'rejete') badgeClass = 'badge-red';

        // Bouton Voir Preuve (Œil)
        let btnPreuve = '';
        if (t.preuve_url) {
          btnPreuve = `<button onclick="voirImage('${t.preuve_url}')" class="btn btn-blue text-xs mr-2">👁️ Voir</button>`;
        }

        // Boutons Actions
        let btnActions = '';
        if (t.statut === 'en_attente') {
          btnActions = `
            <button onclick="valider('${t.id}')" class="btn btn-green text-xs mr-1">✅ Valider</button>
            <button onclick="rejeter('${t.id}')" class="btn btn-red text-xs">❌ Rejeter</button>
          `;
        } else {
          btnActions = '<span class="text-slate-500 text-xs">Terminé</span>';
        }

        return `
          <tr>
            <td>
              <div class="font-bold">${t.nom || 'Anonyme'}</div>
              <div class="text-xs text-slate-400">${t.numero_telephone || ''}</div>
            </td>
            <td class="uppercase text-xs font-bold ${t.type_transaction === 'achat' ? 'text-cyan-400' : 'text-amber-400'}">${t.type_transaction}</td>
            <td>
              <div class="font-bold">${t.montant_usdt} USDT</div>
              <div class="text-xs text-slate-400">${t.montant_fcfa} FCFA</div>
            </td>
            <td><span class="badge ${badgeClass}">${t.statut}</span></td>
            <td>${btnPreuve} ${btnActions}</td>
          </tr>
        `;
      }).join('');
    }

    function voirImage(url) {
      const modal = document.getElementById('modal-img');
      const img = document.getElementById('img-preview');
      img.src = url;
      modal.style.display = 'flex';
    }

    async function valider(id) {
      if (!confirm("Confirmer la validation ?")) return;
      const { error } = await supabase.from('transactions').update({ statut: 'valide' }).eq('id', id);
      if (error) { alert("Erreur: " + error.message); return; }
      showToast("Transaction validée !");
      loadDashboard();
    }

    async function rejeter(id) {
      if (!confirm("Confirmer le rejet ?")) return;
      const { error } = await supabase.from('transactions').update({ statut: 'rejete' }).eq('id', id);
      if (error) { alert("Erreur: " + error.message); return; }
      showToast("Transaction rejetée.");
      loadDashboard();
    }

    // Charger au démarrage
    loadDashboard();
    // Recharger toutes les 15 secondes
    setInterval(loadDashboard, 15000);
  </script>
</body>
</html>
