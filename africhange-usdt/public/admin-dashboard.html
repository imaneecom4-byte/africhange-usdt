<script>
    const SB_URL = 'https://qlsetlqyejwrhztbesto.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc2V0bHF5ZWp3cmh6dGJlc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTc1NzIsImV4cCI6MjEwNDQzMzU3Mn0.kcaf8RzfhPDGsAFhRfqDf6g7JiMSxh2Aoc2kk9v6gZ4';
    const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

    // --- NOTIFICATIONS ---
    function demanderPermissionNotif() {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
    }
    function envoyerNotification(titre, message) {
      if ("Notification" in window && Notification.permission === "granted") {
        try { new Notification(titre, { body: message }); } catch (e) { console.log(e); }
      }
    }
    function showToast(message, type = 'info') {
      // Simple alert pour être sûr que ça marche, ou console log
      console.log("Toast:", message);
      // Si tu veux un vrai toast visuel, on peut le rajouter, mais pour l'instant on débugue
    }

    // --- AUTH ---
    async function verifierAuth() {
      if (!sessionStorage.getItem('africhange_admin_session')) {
        sessionStorage.setItem('africhange_admin_session', 'true');
      }
    }
    verifierAuth();
    demanderPermissionNotif();

    // --- STATS ---
    async function rafraichirStats() {
      try {
        // On ne sélectionne QUE les colonnes qui existent sûrement
        const { data, error } = await sbClient.from('transactions').select('type_transaction, montant_usdt').eq('statut', 'valide');
        if (error) throw error;
        
        const nb = data.length;
        // Calcul simple sans benefice_estime pour éviter l'erreur si la colonne est vide/null
        const achat = data.filter(t => t.type_transaction === 'achat').reduce((sum, t) => sum + (parseFloat(t.montant_usdt) || 0), 0);
        const vente = data.filter(t => t.type_transaction === 'vente').reduce((sum, t) => sum + (parseFloat(t.montant_usdt) || 0), 0);
        
        document.getElementById('stat-benef').textContent = "— FCFA"; // On laisse vide pour l'instant
        document.getElementById('stat-validees').textContent = nb;
        document.getElementById('stat-achat').textContent = achat.toFixed(2) + ' USDT';
        document.getElementById('stat-vente').textContent = vente.toFixed(2) + ' USDT';
      } catch (e) { console.error("Erreur Stats:", e); }
    }

    // --- TRANSACTIONS ---
    async function rafraichirTransactions() {
      const corps = document.getElementById('corps-tableau');
      if(!corps) return;
      
      try {
        const statut = document.getElementById('filtre-statut').value;
        let query = sbClient.from('transactions').select('*').order('created_at', { ascending: false }).limit(50);
        if (statut) query = query.eq('statut', statut);
        
        const { data, error } = await query;
        if (error) throw error;

        if (!data || data.length === 0) {
          corps.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">Aucune transaction trouvée.</td></tr>';
          return;
        }

        // Détection nouvelles transactions
        const nbAttente = data.filter(t => t.statut === 'en_attente').length;
        if (nbAttente > 0) {
           // Logique de notif simplifiée
        }

        corps.innerHTML = data.map(t => {
          const nomClient = `${t.nom || ''} ${t.prenom || ''}`.trim() || 'Anonyme';
          const telephone = t.numero_telephone || '-';
          const typeTx = t.type_transaction || 'inconnu';
          const montantUSDT = t.montant_usdt || 0;
          const montantFCFA = t.montant_fcfa || 0;
          const statutTx = t.statut || 'en_attente';
          const preuveUrl = t.preuve_url || null;
          
          const isAchat = typeTx === 'achat';
          const typeBadge = isAchat 
            ? '<span class="px-2 py-1 rounded bg-cyan-500/10 text-cyan-400 text-xs font-bold border border-cyan-500/20">ACHAT</span>' 
            : '<span class="px-2 py-1 rounded bg-amber-500/10 text-amber-400 text-xs font-bold border border-amber-500/20">VENTE</span>';
          
          let statusClass = 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';
          let statusLabel = 'En attente';
          if (statutTx === 'valide' || statutTx === 'validée') { statusClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'; statusLabel = 'Validée'; }
          else if (statutTx === 'rejete' || statutTx === 'rejetée') { statusClass = 'bg-red-500/10 text-red-400 border-red-500/20'; statusLabel = 'Rejetée'; }

          let actionsHtml = '<span class="text-xs text-slate-600 italic">Terminé</span>';
          if (statutTx === 'en_attente') {
              let btnPreuve = preuveUrl ? `<button onclick="ouvrirModale('${preuveUrl}')" class="p-2 rounded-lg bg-slate-700 hover:bg-blue-500 text-white transition" title="Voir Preuve"><i class="ph ph-eye"></i></button>` : '';
              actionsHtml = `<div class="flex justify-end gap-2">
                    <button onclick="validerTransaction('${t.id}')" class="p-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition shadow-lg shadow-emerald-900/20" title="Valider"><i class="ph ph-check"></i></button>
                    <button onclick="rejeterTransaction('${t.id}')" class="p-2 rounded-lg bg-slate-700 hover:bg-red-500 text-white transition" title="Rejeter"><i class="ph ph-x"></i></button>
                    ${btnPreuve}
                  </div>`;
          } else if (preuveUrl) {
              actionsHtml = `<button onclick="ouvrirModale('${preuveUrl}')" class="p-2 rounded-lg bg-slate-700 hover:bg-blue-500 text-white transition" title="Voir Preuve"><i class="ph ph-eye"></i></button>`;
          }

          return `
            <tr class="hover:bg-white/5 transition group">
              <td class="p-4">
                <div class="font-bold text-white">${nomClient}</div>
                <div class="text-xs text-slate-400">${telephone}</div>
              </td>
              <td class="p-4">${typeBadge}</td>
              <td class="p-4">
                <div class="font-bold text-slate-200">${montantUSDT} USDT</div>
                <div class="text-xs text-slate-500">${montantFCFA} FCFA</div>
              </td>
              <td class="p-4"><span class="status-badge ${statusClass} border">${statusLabel}</span></td>
              <td class="p-4 text-right">${actionsHtml}</td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
        if(corps) corps.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400">Erreur: ${e.message}</td></tr>`;
      }
    }

    // --- ACTIONS (CORRIGÉES POUR ÉVITER 400) ---
    async function validerTransaction(id) { 
      if(!confirm("Confirmer la validation ?")) return; 
      try {
        // On met à jour UNIQUEMENT le statut. Rien d'autre.
        const { error } = await sbClient.from('transactions').update({ statut: 'valide' }).eq('id', id);
        if(error) {
            console.error("Erreur détaillée:", error);
            alert("Erreur Supabase: " + error.message);
            return;
        }
        alert("Transaction validée !");
        rafraichirTransactions(); 
        rafraichirStats(); 
      } catch(e) { 
          console.error(e);
          alert("Erreur JS: " + e.message); 
      }
    }
    
    async function rejeterTransaction(id) { 
      const m = prompt("Motif du rejet :"); 
      if(m===null) return; 
      try {
        // On met à jour UNIQUEMENT le statut.
        const { error } = await sbClient.from('transactions').update({ statut: 'rejete' }).eq('id', id);
        if(error) {
             console.error("Erreur détaillée:", error);
             alert("Erreur Supabase: " + error.message);
             return;
        }
        alert("Transaction rejetée.");
        rafraichirTransactions(); 
      } catch(e) { 
          console.error(e);
          alert("Erreur JS: " + e.message);
      }
    }
    
    function ouvrirModale(url) { 
        const modal = document.getElementById('modale-preuve');
        const img = document.getElementById('modale-image');
        if(modal && img) {
            img.src = url; 
            modal.classList.remove('hidden'); 
        }
    }
    function fermerModale() { 
        const modal = document.getElementById('modale-preuve');
        if(modal) {
            modal.classList.add('hidden'); 
            document.getElementById('modale-image').src = ""; 
        }
    }

    // --- AGENTS (SIMPLIFIÉ) ---
    async function chargerAgentsUI() {
      try {
        const container = document.getElementById('liste-agents-admin');
        if(!container) return;
        
        const { data, error } = await sbClient.from('agents').select('*').order('pays');
        if (error) throw error;
        
        if (!data || data.length === 0) { 
            container.innerHTML = '<div class="text-center text-slate-500 text-sm py-4">Aucun agent configuré.</div>'; 
            return; 
        }
        
        container.innerHTML = data.map(a => `
          <div class="bg-slate-950/50 border border-slate-800 p-3 rounded-xl flex flex-col gap-2 hover:border-emerald-500/30 transition group">
            <div class="flex justify-between items-start">
              <div>
                <div class="text-xs font-bold text-emerald-400 uppercase tracking-wide">${a.pays}</div>
                <div class="text-xs text-slate-400 font-medium">${a.operateur}</div>
              </div>
              <div class="flex gap-1">
                <button onclick="modifierAgent('${a.id}', '${a.numero}')" class="text-slate-500 hover:text-blue-400 p-1" title="Modifier"><i class="ph ph-pencil"></i></button>
                <button onclick="supprimerAgent('${a.id}')" class="text-slate-500 hover:text-red-400 p-1" title="Supprimer"><i class="ph ph-trash"></i></button>
              </div>
            </div>
            <div class="flex gap-2 items-center">
              <input type="text" value="${a.numero || ''}" class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:border-emerald-500 outline-none" id="input-agent-${a.id}">
              <button onclick="sauverAgent('${a.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded font-medium transition">OK</button>
            </div>
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function modifierAgent(id, ancienNumero) {
      const nouveau = prompt("Nouveau numéro :", ancienNumero);
      if(nouveau && nouveau.trim() && nouveau !== ancienNumero) {
        try {
          const { error } = await sbClient.from('agents').update({ numero: nouveau.trim() }).eq('id', id);
          if(error) throw error;
          chargerAgentsUI();
        } catch(e) { alert("Erreur: " + e.message); }
      }
    }

    async function sauverAgent(id) { 
      const input = document.getElementById(`input-agent-${id}`); 
      if(!input) return;
      try { 
        const { error } = await sbClient.from('agents').update({ numero: input.value }).eq('id', id); 
        if(error) throw error;
        alert("Numéro mis à jour");
      } catch (e) { alert("Erreur: " + e.message); } 
    }

    async function supprimerAgent(id) { 
      if(!confirm("Supprimer cet agent ?")) return; 
      try { 
        const { error } = await sbClient.from('agents').delete().eq('id', id); 
        if(error) throw error;
        chargerAgentsUI(); 
      } catch(e) { alert("Erreur suppression"); } 
    }

    async function ajouterAgentPrompt() {
      const pays = prompt("Pays :");
      if(!pays) return;
      const op = prompt("Opérateur :");
      if(!op) return;
      const num = prompt("Numéro :");
      if(!num) return;
      try {
        const { error } = await sbClient.from('agents').insert([{ pays, operateur: op, numero: num }]);
        if(error) throw error;
        chargerAgentsUI();
      } catch(err) { alert("Erreur: " + err.message); }
    }

    // --- CONFIG FORM ---
    const formConfig = document.getElementById('form-config');
    if(formConfig) {
        formConfig.addEventListener('submit', async (e) => { 
          e.preventDefault(); 
          try { 
            const { error } = await sbClient.from('config').update({ 
              taux_achat_client: parseFloat(document.getElementById('cfg-taux-achat').value), 
              taux_vente_client: parseFloat(document.getElementById('cfg-taux-vente').value), 
              adresse_usdt_reception: document.getElementById('cfg-adresse').value 
            }).eq('id', 1); 
            
            if(error) throw error;
            alert("Configuration sauvegardée !"); 
          } catch(err) { alert("Erreur sauvegarde: " + err.message); } 
        });
    }

    function deconnexionAdmin() {
      sessionStorage.removeItem('africhange_admin_session');
      window.location.href = '/admin-login.html';
    }
    
    function afficherNotifications() {
        document.getElementById('filtre-statut').value = 'en_attente';
        rafraichirTransactions();
    }

    // --- INIT ---
    rafraichirStats();
    rafraichirTransactions();
    chargerAgentsUI();
    setInterval(() => { rafraichirTransactions(); rafraichirStats(); }, 15000);
  </script>
