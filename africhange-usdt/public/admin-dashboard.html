<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AfriChange USDT — Admin Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
  .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  .glass-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  
  /* Toast Notification */
  #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: rgba(15, 23, 42, 0.95); color: white; padding: 1rem 1.5rem; border-radius: 0.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-size: 0.875rem; display: flex; align-items: center; gap: 0.75rem; min-width: 280px; max-width: 90vw; animation: slideIn 0.3s ease-out forwards; border-left: 4px solid #10b981; pointer-events: auto; }
  .toast.warning { border-left-color: #f59e0b; }
  .toast.error { border-left-color: #ef4444; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeOut { to { transform: translateX(100%); opacity: 0; } }
  
  /* Modal Image */
  #modale-preuve { display: none; }
  #modale-preuve.active { display: flex; }
  
  @media (max-width: 768px) {
    .lg\\:w-2\\/3, .lg\\:w-1\\/3 { width: 100% !important; }
    .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen selection:bg-emerald-500 selection:text-white">

  <div id="toast-container"></div>

  <!-- Header -->
  <nav class="fixed top-0 w-full z-50 glass-panel border-b-0 border-white/10 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg text-slate-900 font-bold text-lg">₮</div>
      <div>
        <h1 class="font-bold text-base tracking-tight text-white">AfriChange <span class="text-emerald-400">Admin</span></h1>
        <p class="text-xs text-slate-400">Gestion Centrale</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="afficherNotifications()" class="relative p-2 rounded-full hover:bg-white/5 transition group">
        <i class="ph ph-bell text-lg text-slate-300 group-hover:text-emerald-400 transition"></i>
        <span id="badge-notif" class="hidden absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-slate-900 animate-pulse"></span>
      </button>
      <button onclick="deconnexionAdmin()" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-red-500/10 hover:text-red-400 border border-slate-700 transition text-xs font-medium">
        <i class="ph ph-sign-out"></i> <span class="hidden sm:inline">Déconnexion</span>
      </button>
    </div>
  </nav>

  <main class="pt-20 pb-8 px-4 max-w-7xl mx-auto space-y-6">

    <!-- STATS -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 animate-fade-in">
      <div class="glass-card p-4 rounded-xl relative overflow-hidden group">
        <div class="flex justify-between items-start mb-2">
          <div><p class="text-slate-400 text-xs font-medium">Bénéfice Total</p><h3 id="stat-benef" class="text-2xl font-bold text-white mt-1">— FCFA</h3></div>
          <div class="p-2 bg-emerald-500/10 rounded-lg text-emerald-400"><i class="ph ph-currency-dollar text-xl"></i></div>
        </div>
      </div>
      <div class="glass-card p-4 rounded-xl relative overflow-hidden group">
        <div class="flex justify-between items-start mb-2">
          <div><p class="text-slate-400 text-xs font-medium">Transactions Validées</p><h3 id="stat-validees" class="text-2xl font-bold text-white mt-1">—</h3></div>
          <div class="p-2 bg-blue-500/10 rounded-lg text-blue-400"><i class="ph ph-check-circle text-xl"></i></div>
        </div>
      </div>
      <div class="glass-card p-4 rounded-xl relative overflow-hidden group">
        <div class="flex justify-between items-start mb-2">
          <div><p class="text-slate-400 text-xs font-medium">Volume Acheté</p><h3 id="stat-achat" class="text-2xl font-bold text-white mt-1">— USDT</h3></div>
          <div class="p-2 bg-cyan-500/10 rounded-lg text-cyan-400"><i class="ph ph-arrow-down-left text-xl"></i></div>
        </div>
      </div>
      <div class="glass-card p-4 rounded-xl relative overflow-hidden group">
        <div class="flex justify-between items-start mb-2">
          <div><p class="text-slate-400 text-xs font-medium">Volume Vendu</p><h3 id="stat-vente" class="text-2xl font-bold text-white mt-1">— USDT</h3></div>
          <div class="p-2 bg-amber-500/10 rounded-lg text-amber-400"><i class="ph ph-arrow-up-right text-xl"></i></div>
        </div>
      </div>
    </section>

    <!-- CONTENU PRINCIPAL -->
    <div class="flex flex-col lg:flex-row gap-6">
      
      <!-- COLONNE GAUCHE: TRANSACTIONS -->
      <div class="lg:w-2/3 space-y-4 animate-fade-in" style="animation-delay: 0.1s;">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <h2 class="text-lg font-bold text-white flex items-center gap-2"><i class="ph ph-list-dashes text-emerald-400"></i> Transactions Récentes</h2>
          <div class="flex gap-2">
            <select id="filtre-statut" class="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="">Tous les statuts</option>
              <option value="en_attente">En attente</option>
              <option value="valide">Validées 🟢</option>
              <option value="rejete">Rejetées ⚫</option>
            </select>
            <button onclick="rafraichirTransactions()" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-700 transition text-xs"><i class="ph ph-arrows-clockwise"></i></button>
          </div>
        </div>

        <div class="glass-panel rounded-xl overflow-hidden shadow-xl">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[600px]">
              <thead>
                <tr class="bg-slate-900/50 text-slate-400 text-[10px] uppercase tracking-wider border-b border-slate-700">
                  <th class="p-3 font-semibold">Client</th>
                  <th class="p-3 font-semibold">Type</th>
                  <th class="p-3 font-semibold">Montant</th>
                  <th class="p-3 font-semibold">Statut</th>
                  <th class="p-3 font-semibold text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="corps-tableau" class="divide-y divide-slate-800 text-xs">
                <tr><td colspan="5" class="p-6 text-center text-slate-500">Chargement des données...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- COLONNE DROITE: CONFIG & AGENTS -->
      <div class="lg:w-1/3 space-y-4 animate-fade-in" style="animation-delay: 0.2s;">
        
        <!-- Config -->
        <div class="glass-card p-4 rounded-xl">
          <h3 class="font-bold text-white mb-3 flex items-center gap-2 text-sm"><i class="ph ph-sliders text-emerald-400"></i> Configuration</h3>
          <form id="form-config" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] text-slate-400 block mb-1">Taux Achat</label>
                <input type="number" id="cfg-taux-achat" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:border-emerald-500 outline-none" placeholder="750">
              </div>
              <div>
                <label class="text-[10px] text-slate-400 block mb-1">Taux Vente</label>
                <input type="number" id="cfg-taux-vente" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:border-emerald-500 outline-none" placeholder="730">
              </div>
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Adresse USDT</label>
              <input type="text" id="cfg-adresse" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-[10px] font-mono text-slate-300 focus:border-emerald-500 outline-none" placeholder="0x...">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-1.5 rounded-lg shadow-lg transition text-xs">Sauvegarder</button>
          </form>
        </div>

        <!-- Agents -->
        <div class="glass-card p-4 rounded-xl flex flex-col h-[400px]">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-white flex items-center gap-2 text-sm"><i class="ph ph-users text-amber-400"></i> Agents Mobile Money</h3>
            <button onclick="ouvrirModalAgent()" class="text-[10px] bg-slate-800 hover:bg-emerald-600 hover:text-white text-slate-300 px-2 py-1 rounded-lg border border-slate-700 transition flex items-center gap-1">
              <i class="ph ph-plus"></i> Ajouter
            </button>
          </div>
          <div id="liste-agents-admin" class="flex-1 overflow-y-auto space-y-2 pr-1">
            <div class="text-center text-slate-500 mt-10 text-xs">Chargement...</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL PREUVE (ZOOM IMAGE) -->
  <div id="modale-preuve" class="fixed inset-0 bg-black/95 backdrop-blur-sm z-[70] hidden flex items-center justify-center p-4" onclick="fermerModale()">
    <div class="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center">
      <button class="absolute top-4 right-4 text-white hover:text-red-400 text-3xl font-light z-10">&times;</button>
      <img id="modale-image" src="" alt="Preuve de paiement" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl border border-white/10" />
      <p id="modale-info" class="mt-4 text-slate-400 text-sm"></p>
    </div>
  </div>

  <!-- MODAL AJOUT AGENT -->
  <div id="modale-agent" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 w-full max-w-md shadow-2xl">
      <h3 class="text-base font-bold text-white mb-3">Nouvel Agent</h3>
      <form id="form-nouvel-agent" class="space-y-3">
        <div><label class="text-[10px] text-slate-400 block mb-1">Pays</label><select id="new-agent-pays" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white outline-none"><option value="Burkina Faso">🇧🇫 Burkina Faso</option><option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option><option value="Bénin">🇯 Bénin</option><option value="Togo">🇹🇬 Togo</option></select></div>
        <div><label class="text-[10px] text-slate-400 block mb-1">Opérateur</label><select id="new-agent-operateur" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white outline-none"><option value="Orange Money">Orange Money</option><option value="Moov Money">Moov Money</option><option value="MTN Money">MTN Money</option><option value="Wave">Wave</option></select></div>
        <div><label class="text-[10px] text-slate-400 block mb-1">Numéro</label><input type="text" id="new-agent-numero" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white outline-none" placeholder="+225 07..." required></div>
        <div class="flex gap-2 pt-1"><button type="button" onclick="fermerModalAgent()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-1.5 rounded-lg transition text-xs">Annuler</button><button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-1.5 rounded-lg font-medium shadow-lg transition text-xs">Créer</button></div>
      </form>
    </div>
  </div>

  <!-- SCRIPT LOGIQUE COMPLÈTE -->
  <script>
    // --- CONFIG SUPABASE ---
    const SB_URL = 'https://qlsetlqyejwrhztbesto.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc2V0bHF5ZWp3cmh6dGJlc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTc1NzIsImV4cCI6MjEwNDQzMzU3Mn0.kcaf8RzfhPDGsAFhRfqDf6g7JiMSxh2Aoc2kk9v6gZ4';
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    // --- TOAST NOTIFICATION ---
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'warning' ? 'warning' : type === 'error' ? 'error' : ''}`;
      let icon = '';
      if (type === 'success') icon = '✅';
      if (type === 'error') icon = '❌';
      if (type === 'warning') icon = '⚠️';
      toast.innerHTML = `<span class="text-lg">${icon}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease-out forwards';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // --- AUTH ---
    async function verifierAuth() {
      // Simulation simple pour l'instant (à remplacer par vraie auth plus tard)
      if (!sessionStorage.getItem('africhange_admin_session')) {
         // Pour tester, on crée une session fake si elle n'existe pas
         sessionStorage.setItem('africhange_admin_session', 'true');
      }
    }
    verifierAuth();

    // --- STATS ---
    async function rafraichirStats() {
      try {
        const { data, error } = await supabase.from('transactions').select('type_transaction, montant_usdt, benefice_estime').eq('statut', 'valide');
        if (error) throw error;
        const nb = data.length;
        const benef = data.reduce((sum, t) => sum + (parseFloat(t.benefice_estime) || 0), 0);
        const achat = data.filter(t => t.type_transaction === 'achat').reduce((sum, t) => sum + (parseFloat(t.montant_usdt) || 0), 0);
        const vente = data.filter(t => t.type_transaction === 'vente').reduce((sum, t) => sum + (parseFloat(t.montant_usdt) || 0), 0);
        
        document.getElementById('stat-benef').textContent = benef.toLocaleString('fr-FR') + ' FCFA';
        document.getElementById('stat-validees').textContent = nb;
        document.getElementById('stat-achat').textContent = achat.toFixed(2) + ' USDT';
        document.getElementById('stat-vente').textContent = vente.toFixed(2) + ' USDT';
      } catch (e) { console.error(e); }
    }

    // --- TRANSACTIONS (AVEC GESTION DES PREUVES ET ACTIONS) ---
    async function rafraichirTransactions() {
      const corps = document.getElementById('corps-tableau');
      corps.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-500">Actualisation...</td></tr>';
      
      try {
        const statut = document.getElementById('filtre-statut').value;
        let query = supabase.from('transactions').select('*').order('created_at', { ascending: false }).limit(50);
        if (statut) query = query.eq('statut', statut);
        
        const { data, error } = await query;
        if (error) throw error;

        if (!data || data.length === 0) {
          corps.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">Aucune transaction trouvée.</td></tr>';
          return;
        }

        verifierNouvellesTransactions(data);

        corps.innerHTML = data.map(t => {
          const nomClient = `${t.nom || ''} ${t.prenom || ''}`.trim() || 'Anonyme';
          const telephone = t.numero_telephone || '-';
          const typeTx = t.type_transaction || 'inconnu';
          const montantUSDT = t.montant_usdt || 0;
          const montantFCFA = t.montant_fcfa || 0;
          const statutTx = t.statut || 'en_attente';
          const preuveUrl = t.preuve_url || null; // Récupération de l'URL de l'image
          
          const isAchat = typeTx === 'achat';
          const typeBadge = isAchat 
            ? '<span class="px-2 py-1 rounded bg-cyan-500/10 text-cyan-400 text-[10px] font-bold border border-cyan-500/20">ACHAT</span>' 
            : '<span class="px-2 py-1 rounded bg-amber-500/10 text-amber-400 text-[10px] font-bold border border-amber-500/20">VENTE</span>';
          
          let statusClass = 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';
          let statusLabel = 'En attente';
          if (statutTx === 'valide' || statutTx === 'validée') { statusClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'; statusLabel = 'Validée'; }
          else if (statutTx === 'rejete' || statutTx === 'rejetée') { statusClass = 'bg-red-500/10 text-red-400 border-red-500/20'; statusLabel = 'Rejetée'; }

          let actionsHtml = '<span class="text-[10px] text-slate-600 italic">Terminé</span>';
          if (statutTx === 'en_attente') {
              // Boutons d'action + Bouton Voir Preuve si disponible
              let btnPreuve = preuveUrl ? `<button onclick="ouvrirModale('${preuveUrl}', '${nomClient}')" class="p-1.5 rounded-lg bg-slate-700 hover:bg-blue-500 text-white transition" title="Voir Preuve"><i class="ph ph-eye text-sm"></i></button>` : '';
              
              actionsHtml = `<div class="flex justify-end gap-1">
                    <button onclick="validerTransaction('${t.id}')" class="p-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition" title="Valider"><i class="ph ph-check text-sm"></i></button>
                    <button onclick="rejeterTransaction('${t.id}')" class="p-1.5 rounded-lg bg-slate-700 hover:bg-red-500 text-white transition" title="Rejeter"><i class="ph ph-x text-sm"></i></button>
                    ${btnPreuve}
                  </div>`;
          } else if (preuveUrl && statutTx !== 'rejete') {
              // Si validé mais qu'il y a une preuve, on garde le bouton voir
               actionsHtml = `<button onclick="ouvrirModale('${preuveUrl}', '${nomClient}')" class="p-1.5 rounded-lg bg-slate-700 hover:bg-blue-500 text-white transition" title="Voir Preuve"><i class="ph ph-eye text-sm"></i></button>`;
          }

          return `
            <tr class="hover:bg-white/5 transition group">
              <td class="p-3"><div class="font-bold text-white text-xs">${nomClient}</div><div class="text-[10px] text-slate-400">${telephone}</div></td>
              <td class="p-3">${typeBadge}</td>
              <td class="p-3"><div class="font-bold text-slate-200 text-xs">${montantUSDT} USDT</div><div class="text-[10px] text-slate-500">${formaterFCFA(montantFCFA)}</div></td>
              <td class="p-3"><span class="status-badge ${statusClass} border">${statusLabel}</span></td>
              <td class="p-3 text-right">${actionsHtml}</td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
        corps.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400 text-xs">Erreur: ${e.message}. Vérifiez la console (F12).</td></tr>`;
      }
    }

    function formaterFCFA(montant) {
        if (!montant && montant !== 0) return '0 FCFA';
        return parseFloat(montant).toLocaleString('fr-FR') + ' FCFA';
    }

    // --- ACTIONS SUR LES TRANSACTIONS (VALIDER / REJETER) ---
    async function validerTransaction(id) {
      if(!confirm("Confirmer la validation de cette transaction ?")) return;
      
      try {
        // Mise à jour du statut dans Supabase
        const { error } = await supabase
            .from('transactions')
            .update({ statut: 'valide' })
            .eq('id', id);
            
        if (error) throw error;
        
        showToast("Transaction validée avec succès !", "success");
        rafraichirTransactions();
        rafraichirStats();
      } catch (e) {
        console.error(e);
        showToast("Erreur lors de la validation.", "error");
      }
    }

    async function rejeterTransaction(id) {
      const motif = prompt("Motif du rejet (obligatoire) :");
      if (motif === null) return; // Annulé
      if (!motif.trim()) {
        alert("Le motif est obligatoire.");
        return;
      }

      try {
        // Mise à jour du statut dans Supabase
        const { error } = await supabase
            .from('transactions')
            .update({ statut: 'rejete', motif_rejet: motif })
            .eq('id', id);
            
        if (error) throw error;
        
        showToast("Transaction rejetée.", "error");
        rafraichirTransactions();
      } catch (e) {
        console.error(e);
        showToast("Erreur lors du rejet.", "error");
      }
    }

    // --- GESTION MODALE IMAGE ---
    function ouvrirModale(url, clientName) {
      const modal = document.getElementById('modale-preuve');
      const img = document.getElementById('modale-image');
      const info = document.getElementById('modale-info');
      
      // Gestion des URL relatives vs absolues si nécessaire
      // Si l'URL vient de Storage, elle peut être relative ou complète selon ta config
      // Ici on suppose que c'est une URL directe ou relative valide
      img.src = url; 
      info.textContent = `Preuve de paiement pour : ${clientName}`;
      
      modal.classList.remove('hidden');
      modal.classList.add('active'); // Pour l'affichage flex
    }

    function fermerModale() {
      const modal = document.getElementById('modale-preuve');
      modal.classList.add('hidden');
      modal.classList.remove('active');
      document.getElementById('modale-image').src = "";
    }

    // --- NOTIFICATIONS ---
    let dernierNbAttente = 0;
    function verifierNouvellesTransactions(data) {
      const nb = data.filter(t => t.statut === 'en_attente').length;
      if (nb > 0 && nb > dernierNbAttente) {
        showToast(`🔔 ${nb} nouvelle(s) transaction(s) en attente !`, 'warning');
      }
      dernierNbAttente = nb;
      const badge = document.getElementById('badge-notif');
      if (nb > 0) { badge.textContent = nb; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }
    }
    function afficherNotifications() { showToast(`Vous avez ${dernierNbAttente} transaction(s) en attente.`, 'info'); document.getElementById('filtre-statut').value = 'en_attente'; rafraichirTransactions(); }

    // --- AGENTS ---
    async function chargerAgentsUI() {
      try {
        const { data, error } = await supabase.from('agents').select('*').order('pays');
        if (error) throw error;
        const container = document.getElementById('liste-agents-admin');
        if (!data || data.length === 0) { container.innerHTML = '<div class="text-center text-slate-500 text-xs py-4">Aucun agent configuré.</div>'; return; }
        container.innerHTML = data.map(a => `
          <div class="bg-slate-950/50 border border-slate-800 p-2 rounded-lg flex flex-col gap-2 hover:border-emerald-500/30 transition group">
            <div class="flex justify-between items-start">
              <div><div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wide">${a.pays}</div><div class="text-[10px] text-slate-400 font-medium">${a.operateur}</div></div>
              <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition">
                <button onclick="supprimerAgent('${a.id}')" class="text-slate-500 hover:text-red-400 p-1"><i class="ph ph-trash text-sm"></i></button>
              </div>
            </div>
            <div class="flex gap-2 items-center">
              <input type="text" value="${a.numero || ''}" class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-[10px] text-white focus:border-emerald-500 outline-none" id="input-agent-${a.id}">
              <button onclick="sauverAgent('${a.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] px-2 py-1 rounded font-medium transition">OK</button>
            </div>
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }
    async function sauverAgent(id) { const input = document.getElementById(`input-agent-${id}`); const btn = input.nextElementSibling; const oldText = btn.textContent; btn.textContent = '...'; try { const { error } = await supabase.from('agents').update({ numero: input.value }).eq('id', id); if(error) throw error; btn.textContent = '✓'; showToast("Numéro mis à jour", "success"); setTimeout(() => btn.textContent = oldText, 1500); } catch (e) { alert("Erreur: " + e.message); btn.textContent = oldText; } }
    async function supprimerAgent(id) { if(!confirm("Supprimer cet agent ?")) return; try { const { error } = await supabase.from('agents').delete().eq('id', id); if(error) throw error; chargerAgentsUI(); showToast("Agent supprimé", "error"); } catch(e) { alert("Erreur suppression"); } }
    function ouvrirModalAgent() { document.getElementById('modale-agent').classList.remove('hidden'); }
    function fermerModalAgent() { document.getElementById('modale-agent').classList.add('hidden'); }
    document.getElementById('form-nouvel-agent').addEventListener('submit', async (e) => { e.preventDefault(); const pays = document.getElementById('new-agent-pays').value; const op = document.getElementById('new-agent-operateur').value; const num = document.getElementById('new-agent-numero').value; try { const { error } = await supabase.from('agents').insert([{ pays, operateur: op, numero: num }]); if(error) throw error; fermerModalAgent(); chargerAgentsUI(); showToast("Agent ajouté !", "success"); } catch(err) { alert("Erreur: " + err.message); } });

    // --- CONFIG FORM ---
    document.getElementById('form-config').addEventListener('submit', async (e) => { e.preventDefault(); const btn = e.target.querySelector('button'); btn.textContent = 'Enregistrement...'; try { const { error } = await supabase.from('config').update({ taux_achat_client: parseFloat(document.getElementById('cfg-taux-achat').value), taux_vente_client: parseFloat(document.getElementById('cfg-taux-vente').value), adresse_usdt_reception: document.getElementById('cfg-adresse').value }).eq('id', 1); if(error) throw error; showToast("Configuration sauvegardée !", "success"); } catch(err) { showToast("Erreur sauvegarde", "error"); alert("Erreur: " + err.message); } btn.textContent = 'Sauvegarder'; });

    // --- INIT ---
    rafraichirStats();
    rafraichirTransactions();
    chargerAgentsUI();
    setInterval(() => { rafraichirTransactions(); rafraichirStats(); }, 30000);
  </script>
</body>
</html>
