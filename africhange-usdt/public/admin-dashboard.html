<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AfriChange USDT — Admin Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #020617; color: #e2e8f0; }
  .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  .glass-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%); border: 1px solid rgba(255, 255, 255, 0.05); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  
  /* Toast */
  #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: rgba(15, 23, 42, 0.95); color: white; padding: 1rem; border-radius: 0.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 0.75rem; min-width: 250px; animation: slideIn 0.3s ease-out forwards; border-left: 4px solid #10b981; pointer-events: auto; }
  .toast.error { border-left-color: #ef4444; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  
  /* Mobile Optimizations */
  @media (max-width: 768px) {
    .lg\\:w-2\\/3, .lg\\:w-1\\/3 { width: 100% !important; }
    .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
  }
</style>
</head>
<body class="min-h-screen selection:bg-emerald-500 selection:text-white">

  <div id="toast-container"></div>

  <!-- Header -->
  <nav class="sticky top-0 z-50 glass-panel border-b border-white/10 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-slate-900 font-bold">₮</div>
      <div>
        <h1 class="font-bold text-base text-white">AfriChange <span class="text-emerald-400">Admin</span></h1>
        <p class="text-[10px] text-slate-400">Gestion Centrale</p>
      </div>
    </div>
    <button onclick="location.reload()" class="p-2 rounded-full hover:bg-white/10"><i class="ph ph-arrows-clockwise text-xl"></i></button>
  </nav>

  <main class="p-4 max-w-7xl mx-auto space-y-6 pb-20">

    <!-- STATS -->
    <section class="grid grid-cols-2 gap-4">
      <div class="glass-card p-4 rounded-xl">
        <p class="text-slate-400 text-xs">Bénéfice</p>
        <h3 id="stat-benef" class="text-xl font-bold text-white mt-1">— FCFA</h3>
      </div>
      <div class="glass-card p-4 rounded-xl">
        <p class="text-slate-400 text-xs">Validées</p>
        <h3 id="stat-validees" class="text-xl font-bold text-white mt-1">—</h3>
      </div>
    </section>

    <!-- TRANSACTIONS -->
    <div class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-white">Transactions</h2>
        <select id="filtre-statut" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1">
          <option value="">Tous</option>
          <option value="en_attente">En attente</option>
          <option value="valide">Validées</option>
          <option value="rejete">Rejetées</option>
        </select>
      </div>

      <div class="glass-panel rounded-xl overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900/50 text-slate-400 uppercase">
            <tr>
              <th class="p-3">Client</th>
              <th class="p-3">Type</th>
              <th class="p-3">Montant</th>
              <th class="p-3">Statut</th>
              <th class="p-3 text-right">Act.</th>
            </tr>
          </thead>
          <tbody id="corps-tableau" class="divide-y divide-slate-800">
            <tr><td colspan="5" class="p-8 text-center text-slate-500">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- CONFIG & AGENTS -->
    <div class="grid grid-cols-1 gap-6">
      
      <!-- Config -->
      <div class="glass-card p-4 rounded-xl">
        <h3 class="font-bold text-white mb-3 text-sm">Configuration</h3>
        <form id="form-config" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <input type="number" id="cfg-taux-achat" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white" placeholder="Taux Achat">
            <input type="number" id="cfg-taux-vente" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white" placeholder="Taux Vente">
          </div>
          <input type="text" id="cfg-adresse" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white font-mono" placeholder="Adresse USDT">
          <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded text-xs font-bold">Sauvegarder</button>
        </form>
      </div>

      <!-- Agents -->
      <div class="glass-card p-4 rounded-xl">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-white text-sm">Agents Mobile Money</h3>
          <button onclick="alert('Fonctionnalité à venir')" class="text-xs bg-slate-700 px-2 py-1 rounded">+ Ajouter</button>
        </div>
        <div id="liste-agents-admin" class="space-y-2">
          <div class="text-center text-slate-500 text-xs py-4">Chargement...</div>
        </div>
      </div>

    </div>
  </main>

  <!-- MODAL IMAGE -->
  <div id="modale-preuve" class="hidden fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4" onclick="this.classList.add('hidden')">
    <img id="modale-image" src="" class="max-w-full max-h-full object-contain rounded-lg">
  </div>

  <script>
    // --- CONFIGURATION DIRECTE (PAS DE FICHIER EXTERNE) ---
    const SB_URL = 'https://qlsetlqyejwrhztbesto.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc2V0bHF5ZWp3cmh6dGJlc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTc1NzIsImV4cCI6MjEwNDQzMzU3Mn0.kcaf8RzfhPDGsAFhRfqDf6g7JiMSxh2Aoc2kk9v6gZ4';
    
    // CORRECTION ICI : On utilise 'sbClient' pour éviter le conflit "already declared"
    const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

    function showToast(msg, type='info') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${msg}</span>`;
      document.getElementById('toast-container').appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // --- CHARGEMENT DES DONNÉES ---
    async function init() {
      try {
        // Charger Config
        const { data: cfg } = await sbClient.from('config').select('*').single();
        if(cfg) {
          document.getElementById('cfg-taux-achat').value = cfg.taux_achat_client;
          document.getElementById('cfg-taux-vente').value = cfg.taux_vente_client;
          document.getElementById('cfg-adresse').value = cfg.adresse_usdt_reception;
        }

        // Charger Agents
        const { data: agents } = await sbClient.from('agents').select('*');
        const agentContainer = document.getElementById('liste-agents-admin');
        if(agents && agents.length > 0) {
          agentContainer.innerHTML = agents.map(a => `
            <div class="bg-slate-800/50 p-2 rounded flex justify-between items-center text-xs">
              <div>
                <div class="font-bold text-emerald-400">${a.pays}</div>
                <div class="text-slate-400">${a.operateur}</div>
              </div>
              <div class="font-mono text-white">${a.numero}</div>
            </div>
          `).join('');
        } else {
          agentContainer.innerHTML = '<div class="text-center text-slate-500 text-xs">Aucun agent</div>';
        }

        // Charger Transactions
        rafraichirTransactions();

      } catch (e) {
        console.error(e);
        showToast("Erreur de connexion", "error");
      }
    }

    async function rafraichirTransactions() {
      const tbody = document.getElementById('corps-tableau');
      const statut = document.getElementById('filtre-statut').value;
      
      let query = sbClient.from('transactions').select('*').order('created_at', { ascending: false }).limit(20);
      if(statut) query = query.eq('statut', statut);

      const { data, error } = await query;

      if(error) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-red-400 text-center">Erreur: ${error.message}</td></tr>`;
        return;
      }

      if(!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">Aucune transaction</td></tr>';
        return;
      }

      // Stats
      const valides = data.filter(t => t.statut === 'valide');
      document.getElementById('stat-validees').textContent = valides.length;
      
      tbody.innerHTML = data.map(t => {
        const badgeColor = t.statut === 'valide' ? 'bg-emerald-500/20 text-emerald-400' : 
                           t.statut === 'rejete' ? 'bg-red-500/20 text-red-400' : 'bg-yellow-500/20 text-yellow-400';
        
        return `
          <tr class="border-b border-slate-800 hover:bg-white/5">
            <td class="p-3">
              <div class="font-bold text-white">${t.nom || 'Anonyme'}</div>
              <div class="text-[10px] text-slate-500">${t.numero_telephone || ''}</div>
            </td>
            <td class="p-3 text-[10px] uppercase font-bold ${t.type_transaction === 'achat' ? 'text-cyan-400' : 'text-amber-400'}">${t.type_transaction}</td>
            <td class="p-3 font-bold">${t.montant_usdt} <span class="text-[10px] text-slate-500">USDT</span></td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] ${badgeColor}">${t.statut}</span></td>
            <td class="p-3 text-right">
              ${t.preuve_url ? `<button onclick="document.getElementById('modale-image').src='${t.preuve_url}'; document.getElementById('modale-preuve').classList.remove('hidden')" class="text-blue-400"><i class="ph ph-eye"></i></button>` : ''}
              ${t.statut === 'en_attente' ? `
                <button onclick="valider('${t.id}')" class="text-emerald-400 ml-2"><i class="ph ph-check"></i></button>
                <button onclick="rejeter('${t.id}')" class="text-red-400 ml-1"><i class="ph ph-x"></i></button>
              ` : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    // --- ACTIONS ---
    async function valider(id) {
      if(!confirm("Valider ?")) return;
      await sbClient.from('transactions').update({ statut: 'valide' }).eq('id', id);
      showToast("Validée !");
      rafraichirTransactions();
    }

    async function rejeter(id) {
      if(!confirm("Rejeter ?")) return;
      await sbClient.from('transactions').update({ statut: 'rejete' }).eq('id', id);
      showToast("Rejetée", "error");
      rafraichirTransactions();
    }

    document.getElementById('filtre-statut').addEventListener('change', rafraichirTransactions);
    
    document.getElementById('form-config').addEventListener('submit', async (e) => {
      e.preventDefault();
      await sbClient.from('config').update({
        taux_achat_client: parseFloat(document.getElementById('cfg-taux-achat').value),
        taux_vente_client: parseFloat(document.getElementById('cfg-taux-vente').value),
        adresse_usdt_reception: document.getElementById('cfg-adresse').value
      }).eq('id', 1);
      showToast("Config sauvegardée");
    });

    // Lancement
    init();
  </script>
</body>
</html>
