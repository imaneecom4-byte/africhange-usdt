<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acheter des USDT — Étape 4 · En attente</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-5">

  <div class="w-full max-w-md entree-ecran">
    <div class="flex items-center justify-between mb-4">
      <span></span>
      <span class="text-xs text-slate-500">Étape 4 sur 5</span>
    </div>

    <div class="etapes mb-6" id="barre-etapes"></div>

    <div class="card glow-achat p-10 flex flex-col items-center text-center">
      <div class="spinner mb-6"></div>
      <h1 class="font-display text-xl font-semibold mb-2">En attente de validation…</h1>
      <p class="text-sm text-slate-400 max-w-xs">
        Notre équipe vérifie votre preuve de paiement. Patientez quelques minutes, cette page se met à jour automatiquement.
      </p>
      <p id="statut-rejete" class="text-sm text-rose-400 mt-4 hidden">
        Votre transaction a été rejetée. Contactez le support pour plus d'informations.
      </p>
      <p id="erreur-chargement" class="text-sm text-red-400 mt-4 hidden">
        Impossible de charger les détails de la transaction.
      </p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qlsetlqyejwrhztbesto.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc2V0bHF5ZWp3cmh6dGJlc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTc1NzIsImV4cCI6MjEwNDQzMzU3Mn0.kcaf8RzfhPDGsAFhRfqDf6g7JiMSxh2Aoc2kk9v6gZ4';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function rendreEtapes(container, currentStep) {
        if(!container) return;
        container.innerHTML = '';
        for(let i=1; i<=5; i++) {
            const point = document.createElement('div');
            point.className = `etape-point ${i < currentStep ? 'faite' : ''} ${i === currentStep ? ' active' : ''}`;
            container.appendChild(point);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        rendreEtapes(document.getElementById('barre-etapes'), 4);

        const dataJSON = sessionStorage.getItem('transaction_achat');
        const erreurEl = document.getElementById('erreur-chargement');
        const rejeteEl = document.getElementById('statut-rejete');

        if (!dataJSON) {
            erreurEl.textContent = "Aucune transaction trouvée. Veuillez recommencer.";
            erreurEl.classList.remove('hidden');
            setTimeout(() => { window.location.href = '/achat-step1.html'; }, 3000);
            return;
        }

        try {
            const p = JSON.parse(dataJSON);
            const transactionId = p.id;
            
            console.log("Vérification du statut pour la transaction:", transactionId);

            let intervalleVerification;

            async function verifierStatut() {
                try {
                    const { data, error } = await supabaseClient
                        .from('transactions')
                        .select('statut')
                        .eq('id', transactionId)
                        .single();

                    if (error) {
                        console.error("Erreur lors de la vérification:", error);
                        return;
                    }

                    if (data) {
                        console.log("Statut actuel:", data.statut);
                        
                        // ✅ CORRECTION : accepte les DEUX orthographes
                        if (data.statut === 'valide' || data.statut === 'validée') {
                            clearInterval(intervalleVerification);
                            window.location.href = '/achat-step5.html';
                        } else if (data.statut === 'rejete' || data.statut === 'rejetée' || data.statut === 'échouée') {
                            clearInterval(intervalleVerification);
                            rejeteEl.classList.remove('hidden');
                        }
                    }
                } catch (e) {
                    console.error("Erreur silencieuse ignorée:", e);
                }
            }

            verifierStatut();
            intervalleVerification = setInterval(verifierStatut, 6000);

        } catch (e) {
            console.error("Erreur de parsing des données:", e);
            erreurEl.classList.remove('hidden');
        }
    });
  </script>
</body>
</html>
