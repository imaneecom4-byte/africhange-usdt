<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vendre des USDT — Étape 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .operator-card {
    transition: all 0.3s ease;
    border: 2px solid transparent;
  }
  .operator-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .operator-card.selected {
    border-color: #26a17b;
    background: rgba(38, 161, 123, 0.1);
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 10px rgba(38, 161, 123, 0.3); }
    50% { box-shadow: 0 0 20px rgba(38, 161, 123, 0.6); }
  }
  .loading-pulse {
    animation: pulse-glow 2s infinite;
  }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white">

  <!-- Header -->
  <header class="border-b border-slate-700 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
      <button onclick="window.location.href='/index.html'" class="flex items-center gap-2 text-slate-300 hover:text-white transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Accueil
      </button>
      <div class="text-sm text-slate-400">Étape 1 sur 5</div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-8">
    <div class="bg-slate-800/50 backdrop-blur rounded-2xl p-8 border border-slate-700 shadow-2xl">
      
      <div class="mb-8">
        <h1 class="text-3xl font-bold mb-2">Vos informations</h1>
        <p class="text-slate-400">Indiquez où vous souhaitez recevoir vos francs CFA.</p>
      </div>

      <form id="form-vente-step1" class="space-y-6">
        
        <!-- Nom et Prénom -->
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Prénom</label>
            <input type="text" id="prenom" class="champ bg-slate-900 border-slate-600 text-white placeholder-slate-500" placeholder="Ex : Kokou" required />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Nom</label>
            <input type="text" id="nom" class="champ bg-slate-900 border-slate-600 text-white placeholder-slate-500" placeholder="Ex : Adjovi" required />
          </div>
        </div>

        <!-- Numéro de réception -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Numéro de réception (Mobile Money)</label>
          <input type="tel" id="numero-reception" class="champ bg-slate-900 border-slate-600 text-white placeholder-slate-500" placeholder="Ex : +228 90 00 00 00" required />
        </div>

        <!-- Pays -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Pays</label>
          <select id="pays" class="champ bg-slate-900 border-slate-600 text-white" required>
            <option value="">Sélectionnez votre pays</option>
            <option value="Burkina Faso">🇧🇫 Burkina Faso</option>
            <option value="Côte d'Ivoire">🇮 Côte d'Ivoire</option>
            <option value="Bénin">🇯🇯 Bénin</option>
            <option value="Togo">🇬 Togo</option>
          </select>
        </div>

        <!-- Opérateurs disponibles (affichés dynamiquement) -->
        <div id="operateurs-container" class="hidden">
          <label class="block text-sm font-medium text-slate-300 mb-3">Opérateur de réception</label>
          <div id="liste-operateurs" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Les opérateurs seront injectés ici par JavaScript -->
          </div>
          <input type="hidden" id="operateur-selectionne" required />
        </div>

        <!-- Montant à vendre -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Montant à vendre (USDT)</label>
          <input type="number" step="0.01" id="montant-usdt" class="champ bg-slate-900 border-slate-600 text-white placeholder-slate-500" placeholder="Ex : 30" min="1" required />
          <p id="taux-info" class="text-sm text-slate-400 mt-2">Taux de vente : <span id="taux-valeur">chargement...</span></p>
          <p id="montant-fcfa" class="text-lg font-bold text-emerald-400 mt-1"></p>
        </div>

        <!-- Messages d'erreur -->
        <div id="message-erreur" class="text-red-400 text-sm hidden"></div>

        <!-- Bouton Suivant -->
        <button type="submit" class="btn btn-primary w-full py-4 text-lg font-semibold">
          Suivant →
        </button>
      </form>
    </div>
  </main>

  <script>
    // Configuration Supabase
    const SUPABASE_URL = 'https://qlsetlqyejwrhztbesto.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc2V0bHF5ZWp3cmh6dGJlc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTc1NzIsImV4cCI6MjEwNDQzMzU3Mn0.kcaf8RzfhPDGsAFhRfqDf6g7JiMSxh2Aoc2kk9v6gZ4';
    
    let supabase;
    if (typeof window !== 'undefined' && typeof window.supabase !== 'undefined') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let config = null;
    let agents = [];

    // Charger la configuration et les agents au démarrage
    async function chargerDonneesInitiales() {
      try {
        // Charger la config
        const { data: configData, error: configError } = await supabase
          .from('config')
          .select('*')
          .limit(1)
          .single();

        if (configError && configError.code !== 'PGRST116') {
          throw configError;
        }

        config = configData || {
          taux_vente_client: 730,
          adresse_usdt_reception: '0x5da17b728ab2d61ab273a1844b4ce0db4c545f95'
        };

        document.getElementById('taux-valeur').textContent = `${config.taux_vente_client} FCFA/USDT`;

        // Charger les agents
        const { data: agentsData, error: agentsError } = await supabase
          .from('agents')
          .select('*')
          .eq('actif', true);

        if (agentsError) throw agentsError;
        agents = agentsData || [];

      } catch (error) {
        console.error('Erreur chargement données:', error);
        const messageEl = document.getElementById('message-erreur');
        messageEl.textContent = 'Impossible de charger les données. Veuillez réessayer.';
        messageEl.classList.remove('hidden');
      }
    }

    // Afficher les opérateurs selon le pays sélectionné
    document.getElementById('pays').addEventListener('change', function() {
      const paysSelectionne = this.value;
      const container = document.getElementById('operateurs-container');
      const listeOperateurs = document.getElementById('liste-operateurs');
      
      if (!paysSelectionne) {
        container.classList.add('hidden');
        return;
      }

      // Filtrer les agents pour ce pays
      const agentsPays = agents.filter(agent => agent.pays === paysSelectionne);
      
      if (agentsPays.length === 0) {
        listeOperateurs.innerHTML = '<p class="text-slate-400 col-span-full text-center">Aucun opérateur disponible pour ce pays.</p>';
        container.classList.remove('hidden');
        return;
      }

      // Générer les cartes d'opérateurs avec logos
      listeOperateurs.innerHTML = agentsPays.map(agent => {
        const logoClass = getLogoClass(agent.operateur);
        return `
          <div class="operator-card bg-slate-900 border border-slate-700 rounded-xl p-4 cursor-pointer" 
               onclick="selectionnerOperateur('${agent.operateur}', this)">
            <div class="flex flex-col items-center text-center">
              <div class="${logoClass} w-12 h-12 rounded-full flex items-center justify-center mb-2 text-lg font-bold">
                ${getLogoInitial(agent.operateur)}
              </div>
              <p class="font-medium text-white">${agent.operateur}</p>
              <p class="text-xs text-slate-400 mt-1">${agent.numero || 'Non spécifié'}</p>
            </div>
          </div>
        `;
      }).join('');

      container.classList.remove('hidden');
    });

    function selectionnerOperateur(operateur, element) {
      // Retirer la sélection précédente
      document.querySelectorAll('.operator-card').forEach(card => {
        card.classList.remove('selected');
      });
      
      // Ajouter la sélection actuelle
      element.classList.add('selected');
      document.getElementById('operateur-selectionne').value = operateur;
    }

    function getLogoClass(operateur) {
      const logos = {
        'Orange Money': 'bg-orange-500 text-white',
        'Moov Money': 'bg-blue-500 text-white',
        'MTN Money': 'bg-yellow-500 text-black',
        'Wave': 'bg-cyan-500 text-white',
        'Celtiis': 'bg-purple-500 text-white',
        'Mix Bay Yas': 'bg-green-500 text-white'
      };
      return logos[operateur] || 'bg-slate-600 text-white';
    }

    function getLogoInitial(operateur) {
      const initials = {
        'Orange Money': 'OM',
        'Moov Money': 'MM',
        'MTN Money': 'MTN',
        'Wave': 'W',
        'Celtiis': 'C',
        'Mix Bay Yas': 'MBY'
      };
      return initials[operateur] || operateur.substring(0, 2).toUpperCase();
    }

    // Calculer le montant FCFA en temps réel
    document.getElementById('montant-usdt').addEventListener('input', function() {
      const montantUSDT = parseFloat(this.value) || 0;
      if (montantUSDT > 0 && config) {
        const montantFCFA = montantUSDT * config.taux_vente_client;
        document.getElementById('montant-fcfa').textContent = 
          `Vous recevrez : ${montantFCFA.toLocaleString('fr-FR')} FCFA`;
      } else {
        document.getElementById('montant-fcfa').textContent = '';
      }
    });

    // Gestion de la soumission du formulaire
    document.getElementById('form-vente-step1').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const messageEl = document.getElementById('message-erreur');
      messageEl.classList.add('hidden');

      // Validation
      const operateurSelectionne = document.getElementById('operateur-selectionne').value;
      if (!operateurSelectionne) {
        messageEl.textContent = 'Veuillez sélectionner un opérateur de réception.';
        messageEl.classList.remove('hidden');
        return;
      }

      // Récupérer les données du formulaire
      const formData = {
        prenom: document.getElementById('prenom').value,
        nom: document.getElementById('nom').value,
        numero_reception: document.getElementById('numero-reception').value,
        pays: document.getElementById('pays').value,
        operateur: operateurSelectionne,
        montant_usdt: parseFloat(document.getElementById('montant-usdt').value),
        type_transaction: 'vente',
        statut: 'en_attente'
      };

      // Calculer le montant FCFA
      formData.montant_fcfa = formData.montant_usdt * config.taux_vente_client;
      formData.taux_applique = config.taux_vente_client;
      formData.adresse_wallet_usdt = config.adresse_usdt_reception;

      try {
        // Sauvegarder la transaction dans Supabase
        const { data, error } = await supabase
          .from('transactions')
          .insert([formData])
          .select()
          .single();

        if (error) throw error;

        // Stocker les données pour les étapes suivantes
        sessionStorage.setItem('transaction_vente', JSON.stringify(data));
        
        // Rediriger vers l'étape 2
        window.location.href = '/vente-step2.html';
        
      } catch (error) {
        console.error('Erreur sauvegarde transaction:', error);
        messageEl.textContent = 'Une erreur est survenue. Veuillez réessayer.';
        messageEl.classList.remove('hidden');
      }
    });

    // Initialisation
    chargerDonneesInitiales();
  </script>
</body>
</html>
